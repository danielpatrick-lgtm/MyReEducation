<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Real Estate Academy — Your New Career Starts Here</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@1,400;1,500;1,600&family=Space+Grotesk:wght@500;600;700&family=DM+Serif+Display:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<link rel="preload" as="image" href="assets/hero-classroom.jpg"/>
<link rel="stylesheet" href="styles.css"/>

<!-- Resources referenced in JSX strings — must be declared here so the bundler can inline them -->
<meta name="ext-resource-dependency" content="assets/logo.png"           data-resource-id="logo"/>
<meta name="ext-resource-dependency" content="assets/hero-classroom.jpg" data-resource-id="heroPhoto"/>
<meta name="ext-resource-dependency" content="assets/why-income.jpg"     data-resource-id="whyIncome"/>
<meta name="ext-resource-dependency" content="assets/why-flex.jpg"       data-resource-id="whyFlex"/>
<meta name="ext-resource-dependency" content="assets/why-entrep.jpg"     data-resource-id="whyEntrep"/>
<meta name="ext-resource-dependency" content="assets/state-az.jpg"       data-resource-id="stateAZ"/>
<meta name="ext-resource-dependency" content="assets/state-ca.jpg"       data-resource-id="stateCA"/>
<meta name="ext-resource-dependency" content="assets/state-nv.jpg"       data-resource-id="stateNV"/>

<script>
  // Defaults for non-bundled (dev) mode. Bundler overrides these at runtime with blob URLs.
  (function () {
    var defaults = {
      logo:       'assets/logo.png',
      heroPhoto:  'assets/hero-classroom.jpg',
      whyIncome:  'assets/why-income.jpg',
      whyFlex:    'assets/why-flex.jpg',
      whyEntrep:  'assets/why-entrep.jpg',
      stateAZ:    'assets/state-az.jpg',
      stateCA:    'assets/state-ca.jpg',
      stateNV:    'assets/state-nv.jpg',
    };
    window.__resources = Object.assign({}, defaults, window.__resources || {});
  })();
</script>

<style>
  /* Cinematic hero background animation (simulates video) */
  .hero-bg-anim {
    position: absolute; inset: 0;
    background:
      radial-gradient(45% 35% at 20% 30%, rgba(199,203,209,0.18) 0%, transparent 65%),
      radial-gradient(50% 40% at 80% 60%, rgba(226,106,44,0.10) 0%, transparent 65%),
      radial-gradient(60% 45% at 50% 80%, rgba(31,41,55,0.45) 0%, transparent 65%),
      linear-gradient(180deg, #0b0b0c 0%, #141414 100%);
    animation: cinematicShift 18s ease-in-out infinite alternate;
  }
  .hero-bg-anim::after {
    content: "";
    position: absolute; inset: 0;
    background-image:
      repeating-linear-gradient(180deg, transparent 0, transparent 2px, rgba(255,255,255,0.014) 2px, rgba(255,255,255,0.014) 3px);
    mix-blend-mode: overlay;
  }
  @keyframes cinematicShift {
    0%   { background-position: 0% 0%, 100% 100%, 50% 100%, 0 0; transform: scale(1); }
    100% { background-position: 8% 4%, 92% 96%, 50% 100%, 0 0; transform: scale(1.04); }
  }
</style>
</head>
<body>

<template id="__bundler_thumbnail">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" style="width:100%;height:100%;display:block;background:linear-gradient(135deg,#1a1a1a 0%,#0b0b0c 100%)">
    <g transform="translate(50,50)" stroke="#C7CBD1" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15 5 L0 -10 L15 5 L15 15 L-15 15 Z"/>
      <path d="M-6 15 L-6 7 L6 7 L6 15"/>
    </g>
    <text x="50" y="78" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="6" font-weight="700" letter-spacing="1.5" fill="#C7CBD1">REAL ESTATE</text>
    <text x="50" y="86" text-anchor="middle" font-family="Montserrat, sans-serif" font-size="6" font-weight="700" letter-spacing="1.5" fill="#F8F8F5">ACADEMY</text>
  </svg>
</template>


<div id="root"></div>

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

</html>
